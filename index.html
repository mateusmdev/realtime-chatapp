<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-time Chat App</title>
  </head>
  <body>
    <main>
      <section class="wallpaper" id="wallpaper">
        <div class="overlay" id="overlay"></div>
      </section>
      <section class="login">
        <div class="login-container">
          <div class="logo-wrapper">
            <img src="./src/assets/app-icon.svg" alt="app Logo" id="logo">
            <p>Realtime Chat App</p>
          </div>
          
          <div class="form-wrapper">
            <p class="sign-text">Sign in with</p>
            <form action="#" id="form">
              <button id="submit-btn" type="submit">Google</button>
            </form>
            <div class="term-container">
              <input id="term-toggle" type="checkbox">
              <p>When using this application, you accept all of the <a id="terms-btn" href="#">Terms of Use</a>.</p>
            </div>
          </div>
        </div>
      </section>
      <section id="terms-of-use" class="terms-of-use disabled">
        <div class="container">
          <div class="languages-button">
            <div class="container">
              <button>En</button>
              <button class="disabled">Pt-Br</button>
            </div>
          </div>
          <div class="terms-container">
            <div class="terms" id="en-terms">
              <p>Terms of Use in English comes here.</p>
            </div>
            <div class="terms disabled" id="pt-terms">
              <p>Terms of Use in Portuguese comes here.</p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/controller/IndexController.js"></script>
  </body>
</html>
